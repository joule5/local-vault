<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Local Vault" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Fully offline encrypted notebook with text and stylus drawing. Nothing leaves your device." />

  <!-- Strict Content Security Policy: no external connections allowed -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    connect-src 'none';
    font-src 'none';
    object-src 'none';
    media-src 'none';
    frame-src 'none';
    base-uri 'self';
    form-action 'none';
  ">

  <title>Local Vault</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div id="app">
    <p class="boot-msg">Loading Local Vault…</p>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
